<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IIT Madras Travel Study</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f4f1ec;font-family:'DM Sans',system-ui,sans-serif}
  .box{text-align:center;padding:40px;background:#fff;border-radius:16px;border:1px solid #e0dcd5;max-width:480px}
  h2{font-size:22px;color:#1b4332;margin-bottom:12px}
  p{color:#6b6b6b;font-size:14px;line-height:1.7;margin-bottom:24px}
  .spinner{width:40px;height:40px;border:4px solid #d8f3dc;border-top-color:#2d6a4f;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h2>IIT Madras Travel Study</h2>
  <p>Please wait while we set up your survey...</p>
</div>
<script>
  // Randomly assign to Block 1 or Block 2 with equal probability
  const block = Math.random() < 0.5 ? 'block1-final-v2.html' : 'block2-final.html';
  window.location.replace(block);
</script>
</body>
</html>
